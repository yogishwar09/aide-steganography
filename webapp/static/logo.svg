<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AIDE logo">
  <title>AIDE — Adaptive Intelligent Dynamic Embedding Framework</title>
  <defs>
    <linearGradient id="aideBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c6ff0"/>
      <stop offset="1" stop-color="#21c7de"/>
    </linearGradient>
  </defs>

  <!-- app-icon background: the console's own violet-to-cyan accent gradient -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#aideBg)"/>

  <!-- shield: defence / intelligence framing -->
  <path d="M32 8 13 17v14.4c0 12 8.4 20.4 19.2 24 10.8-3.6 19.2-12 19.2-24V17z"
        fill="none" stroke="#1a1330" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- 3x3 block grid: an image partitioned into blocks, the way AIDE scores and embeds -->
  <g stroke="#1a1330" stroke-width="1.6" fill="none">
    <rect x="22.5" y="22.5" width="5" height="5"/>
    <rect x="29.5" y="22.5" width="5" height="5"/>
    <rect x="36.5" y="22.5" width="5" height="5"/>
    <rect x="22.5" y="29.5" width="5" height="5"/>
    <rect x="36.5" y="29.5" width="5" height="5"/>
    <rect x="22.5" y="36.5" width="5" height="5"/>
    <rect x="29.5" y="36.5" width="5" height="5"/>
    <rect x="36.5" y="36.5" width="5" height="5"/>
  </g>
  <!-- one filled block: the hidden payload, indistinguishable from its neighbors at a glance -->
  <rect x="29.5" y="29.5" width="5" height="5" fill="#1a1330"/>
</svg>
