[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aide"
version = "0.2.0"
description = "AIDE - Adaptive Intelligent Dynamic Embedding: robust adaptive image steganography and steganalysis"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "P. Yogishwar" }]
keywords = ["steganography", "steganalysis", "reed-solomon", "aes-gcm", "dct", "image-forensics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "opencv-python-headless>=4.8",
    "scikit-learn>=1.3",
    "scikit-image>=0.21",
    "PyWavelets>=1.4",
    "Pillow>=10.0",
    "pycryptodome>=3.19",
    "reedsolo>=1.7",
    "psutil",
    "joblib",
]

[project.optional-dependencies]
web = ["flask>=3.0", "gunicorn>=21.2"]
data = ["requests>=2.31"]
report = ["reportlab>=4.0"]
dev = ["pytest>=7.4", "ruff>=0.5", "flask>=3.0", "requests>=2.31"]

[project.scripts]
aide = "aide.cli:main"

[tool.setuptools]
packages = ["aide", "aide.embedding"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = ["docs/make_report.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# UP007/UP045: `X | None` annotations are already used via `from __future__ import annotations`;
# B905: zip(strict=) needs 3.10+ and the package supports 3.9.
ignore = ["UP007", "UP045", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"webapp/app.py" = ["E402"]
"scripts/*" = ["E402"]
