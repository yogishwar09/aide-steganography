name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev,web,data]"
      - name: Cache sample images
        uses: actions/cache@v4
        with:
          path: data/samples
          key: bossbase-samples-v1
      - name: Fetch sample covers
        run: python scripts/fetch_dataset.py --count 60
      - name: Train decision engine and detector
        run: |
          aide train --images data/samples --out data/models --max-blocks 20000
          aide train-detector --images data/samples --out data/models --workers 2
      - name: Test
        run: pytest -q
      - name: Benchmark smoke test
        run: aide benchmark --num-images 6 --profiles balanced robust --out reports/ci-benchmark --workers 2

  docker:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t aide:ci .
      - name: Container health check
        run: |
          docker run -d --name aide -p 5050:5050 aide:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5050/healthz && exit 0; sleep 2; done
          docker logs aide; exit 1
